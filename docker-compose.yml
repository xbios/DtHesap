services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: dthesap-php
    container_name: dthesap-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dthesap
      DB_USERNAME: dthesap
      DB_PASSWORD: secret
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    container_name: dthesap-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: dthesap-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: dthesap
      MYSQL_USER: dthesap
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  node:
    image: node:20-alpine
    container_name: dthesap-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  dbdata: